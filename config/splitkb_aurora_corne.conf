# Power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Logging
CONFIG_ZMK_USB_LOGGING=n

# Keyboard name
CONFIG_ZMK_KEYBOARD_NAME="WierdCorne"

# Backlight (Confirmed: using RGB chain instead of PWM)
#CONFIG_ZMK_BACKLIGHT=y
#CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
#CONFIG_ZMK_BACKLIGHT_AUTO_OFF_USB=y

# Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
#CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100
CONFIG_SPI=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=7